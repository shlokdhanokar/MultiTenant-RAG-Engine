services:
  - type: web
    name: rag-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 'free' spins the instance down after ~15 minutes idle, so the next
    # visitor waits for a container boot before the app even starts warming.
    # Move to 'starter' if the demo is being actively shared.
    plan: free
    healthCheckPath: /health
    envVars:
      # Must be the deployed API's own https URL. Image links are HMAC-signed
      # against it, so leaving the localhost default serves links no browser
      # outside this machine can load.
      - key: APP_BASE_URL
        sync: false
      # Comma-separated origins allowed to call /api/demo/*. Set this to the
      # UI's deployed origin — the "*" default lets any site spend your
      # provider quota from its own visitors' browsers, spread across enough
      # addresses to stay under the per-caller rate limits.
      - key: CORS_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      # Where rate-limit counters live. Left unset it falls back to MONGODB_URI,
      # which is what keeps limits consistent across the two Gunicorn workers —
      # in-process storage gives each worker its own and doubles every limit.
      - key: RATELIMIT_STORAGE_URI
        sync: false
      # gemini, not groq: one RAG call spends ~9k tokens on retrieved context
      # and Groq's free tier allows 12k per minute, which rate-limits after
      # roughly one query every 45 seconds. Gemini's is ~250k.
      - key: LLM_PROVIDER
        value: gemini
      # Only needed if you switch LLM_PROVIDER to groq.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: llama-3.3-70b-versatile
      # Required on every provider — embeddings are always Gemini.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "1536"
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: IMAGE_URL_SIGNING_SECRET
        sync: false
      - key: MAX_API_KEYS_LIMIT
        value: "5"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: CALENDLY_CLIENT_ID
        sync: false
      - key: CALENDLY_CLIENT_SECRET
        sync: false
